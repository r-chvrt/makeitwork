services:
  makeitwork:
    build: .
    container_name: makeitwork
    restart: unless-stopped
    volumes:
      - ./data:/app/data          # persistance SQLite (épinglés + offres scrapées)
    environment:
      - SCRAPE_INTERVAL_MINUTES=30   # fréquence de rafraîchissement des recherches suivies
      - SCRAPE_LIMIT=100             # offres max par site et par recherche
    # Décommenter pour tester sans Traefik :
    # ports:
    #   - "8000:8000"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.makeitwork.rule=Host(`makeitwork.xxx`)"
      - "traefik.http.routers.makeitwork.entrypoints=websecure"
      - "traefik.http.routers.makeitwork.tls.certresolver=letsencrypt"

      - "traefik.http.services.makeitwork.loadbalancer.server.port=8000"

      - "traefik.http.routers.makeitwork.middlewares=secured@file"
networks:
  proxy:
    external: true
